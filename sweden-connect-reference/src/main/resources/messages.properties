idp.msg.help.1.title=What is the Sweden Connect reference IdP?
idp.msg.help.1.text=<p>The Sweden Connect reference IdP is a reference implementation of a SAML Identity Provider and an \
OpenID Provider that functions according to the <a href="https://docs.swedenconnect.se/technical-framework/" target="_blank">Swedish eID Framework</a> \
and the <a href="https://www.oidc.se/specifications/" target="_blank">Swedish OpenID Connect specifications</a>.</p>\
<p>No actual user authentication is performed. Instead, this is simulated, and you simply select which user to authenticate as.</p>\
<p>The source code for the reference implementation can be found at <a href="https://github.com/swedenconnect/spring-authentication-server" target="_blank">https://github.com/swedenconnect/spring-authentication-server</a>.</p>

# Errors that cannot be reported back to the requester
authn-server.error.unrecoverable.internal = An internal error occurred.
authn-server.error.unrecoverable.session = The authentication could not be completed since the session data was not found. \
The session may have expired, or the page may have been opened twice.
authn-server.error.unrecoverable.oidc.client-configuration = The service that sent you here has an invalid configuration.
authn-server.error.unrecoverable.oidc.invalid-request = The request from the service that sent you here is invalid.
authn-server.error.unrecoverable.oidc.unknown-client = The service that sent you here is not known.
authn-server.error.unrecoverable.oidc.client-lookup-failed = The service that sent you here could not be checked right now. Please try again later.
authn-server.error.unrecoverable.oidc.redirect-uri = The request from the service that sent you here has an invalid return address.
authn-server.error.unrecoverable.oidc.response-mode = The request from the service that sent you here asks for an unsupported response mode.
authn-server.error.saml.unrecoverable.decode = The request from the service that sent you here could not be decoded.
authn-server.error.saml.unrecoverable.format = The request from the service that sent you here is invalid.
authn-server.error.saml.unrecoverable.endpoint = The request was sent to the wrong address.
authn-server.error.saml.unrecoverable.too-old = The request from the service that sent you here is too old.
authn-server.error.saml.unrecoverable.unknown-peer = The service that sent you here is not known.
authn-server.error.saml.unrecoverable.peer-lookup-failed = Information about the service that sent you here could not be obtained.
authn-server.error.saml.unrecoverable.replay = The request has already been processed.
authn-server.error.saml.unrecoverable.acs = The request from the service that sent you here has an invalid return address.
authn-server.error.saml.unrecoverable.no-signature = The request from the service that sent you here is not signed.
authn-server.error.saml.unrecoverable.bad-signature = The signature of the request from the service that sent you here is invalid.
