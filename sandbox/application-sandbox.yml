#
# Configuration of the Sweden Connect reference authentication server in the Sweden Connect Sandbox federation,
# active with the "sandbox" profile. It supplies what the default configuration of the service leaves to the
# deployment, and runs the service as both a SAML Identity Provider and an OpenID Provider.
#
# Loaded with spring.config.additional-location, see README.md in this directory. The environment variables, and
# their defaults, are listed there.
#
# Every file that is read is given relative to REF_CONFIG_LOCATION (default file:./sandbox, this directory when the
# service is started from the root of the repository). Every file that is written is placed under REF_DATA_DIR
# (default /var/lib/reference).
#

# The directories, given once.
reference-sandbox:
  config-location: ${REF_CONFIG_LOCATION:file:./sandbox}
  data-dir: ${REF_DATA_DIR:/var/lib/reference}

spring:
  # The simulated users, read from common/users.yml, a copy of the users of the service. They are imported here, since
  # authn-server-reference.users-location only takes effect when set before application.yml is read (as IDP_CONFIG_DIR).
  # Users imported here replace those of the service.
  config:
    import:
      - ${REF_CONFIG_LOCATION:file:./sandbox}/common/users.yml

  # The TLS key store. Kept apart from the other keys, since TLS certificates are renewed on a schedule of their own.
  #
  # TEST KEY: the default, common/dummy-tls.jks, holds a self-signed test certificate. A deployment replaces it.
  ssl:
    bundle:
      jks:
        tls:
          key:
            alias: ${REF_TLS_KEY_ALIAS:tls}
            password: ${REF_TLS_KEY_PASSWORD:secret}
          keystore:
            location: ${REF_TLS_KEYSTORE:${reference-sandbox.config-location}/common/dummy-tls.jks}
            password: ${REF_TLS_KEYSTORE_PASSWORD:secret}
            type: ${REF_TLS_KEYSTORE_TYPE:JKS}

# The keys of the service, as credential bundles:
#   signing        - EC, signs SAML responses and assertions, and is the default OIDC signing key
#   encryption     - RSA, SAML encryption and OIDC decryption
#   federation-key - signs the OpenID Federation entity configuration and the SAML metadata
#
# TEST KEYS: the default key store, common/dummy.jks, holds freshly generated test keys with self-signed
# certificates. A deployment replaces it with its own key store, through the REF_KEYSTORE variables.
credential:
  bundles:
    keystore:
      reference-keys:
        location: ${REF_KEYSTORE:${reference-sandbox.config-location}/common/dummy.jks}
        password: ${REF_KEYSTORE_PASSWORD:secret}
        type: ${REF_KEYSTORE_TYPE:JKS}
    jks:
      signing:
        name: "Reference Signing Key"
        store-reference: reference-keys
        key:
          alias: ${REF_SIGN_KEY_ALIAS:sign}
          key-password: ${REF_SIGN_KEY_PASSWORD:secret}
      encryption:
        name: "Reference Encryption Key"
        store-reference: reference-keys
        key:
          alias: ${REF_ENCRYPT_KEY_ALIAS:encrypt}
          key-password: ${REF_ENCRYPT_KEY_PASSWORD:secret}
      federation-key:
        name: "Reference Federation Key"
        store-reference: reference-keys
        key:
          alias: ${REF_FEDERATION_KEY_ALIAS:federation}
          key-password: ${REF_FEDERATION_KEY_PASSWORD:secret}

# Audit events are kept in memory, where the Actuator reads them, and written to a file.
audit:
  repository:
    in-memory:
      enabled: true
    file:
      log-file: ${reference-sandbox.data-dir}/audit/audit.log

authn-server:
  base-url: https://ref.sandbox.swedenconnect.se

  # The secret that takes part in the computation of the SAML NameID and the OIDC sub.
  #
  # TEST VALUE: a deployment sets REF_SUBJECT_ID_SECRET.
  subject-identifier:
    secret: ${REF_SUBJECT_ID_SECRET:sandbox-reference-test-secret}

  # Everything is kept in memory, by one instance.
  storage:
    type: memory

  # State that survives a restart: the own trust marks and the OpenID Federation client cache.
  cache-directory: ${reference-sandbox.data-dir}/cache

  saml:
    entity-id: https://ref.sandbox.swedenconnect.se/idp
    credentials:
      sign:
        bundle: signing
      encrypt:
        bundle: encryption
      metadata-sign:
        bundle: federation-key

    # The Service Providers of the Sandbox federation. The metadata is verified with the certificate of the Sandbox
    # metadata service, downloaded from https://md.sandbox.swedenconnect.se/mdreg/pub/metadata-cert.crt.
    metadata-providers:
      - location: https://md.sandbox.swedenconnect.se/metadata/mdx/role/sp.xml
        validation-certificate: ${reference-sandbox.config-location}/saml/metadata-signing.crt
        backup-location: ${reference-sandbox.data-dir}/saml/sp-metadata-backup.xml

    # The signing key is an EC key, so the signing methods are ECDSA. The encryption key is an RSA key, so the
    # encryption methods of application.yml are kept.
    metadata:
      signing-methods:
        - algorithm: http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha256
          min-key-size: 256
        - algorithm: http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha384
          min-key-size: 256
        - algorithm: http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha512
          min-key-size: 256

  # The OpenID Provider. The issuer, which is also its OpenID Federation entity identifier, is the base URL.
  oidc:
    issuer: https://ref.sandbox.swedenconnect.se
    keys:
      signing:
        - credential:
            bundle: signing
          default-key: true
      decryption:
        - credential:
            bundle: encryption

    # Membership of the Sandbox OpenID Federation, registered under the OP registration intermediate. The clients,
    # Relying Parties, are resolved through the resolver at the trust anchor. No trust marks are required of them, so
    # every RP in the Sandbox federation may use the service.
    federation:
      enabled: true
      authority-hints:
        - https://fed.sandbox.swedenconnect.se/im-reg-sc-op
      keys:
        - credential:
            bundle: federation-key
      trust-anchor:
        entity-id: https://fed.sandbox.swedenconnect.se/trustanchor
        # The trust anchor federation key, as published in Section 5.3.1 of
        # https://docs.swedenconnect.se/federation/oidf-structure.html.
        jwks: ${reference-sandbox.config-location}/oidc/trust-anchor.jwks

      # The trust marks of the OpenID Provider, verified with the federation keys of their issuers.
      #
      # oidc/tmi-loa.jwks and oidc/tmi-contracts.jwks hold the "jwks" of the subordinate statements about the issuers,
      # fetched from their superiors (tmi-loa under im-reg-sc, tmi-contracts under im-reg-sc-op), whose own subordinate
      # statements were fetched from the trust anchor. Each statement was verified, starting with the published trust
      # anchor key. Fetched 2026-10-06.
      trust-marks:
        - type: https://id.swedenconnect.se/loa/loa2
          issuer: https://fed.sandbox.swedenconnect.se/tmi-loa
          jwks: ${reference-sandbox.config-location}/oidc/tmi-loa.jwks
        - type: https://id.swedenconnect.se/loa/loa3
          issuer: https://fed.sandbox.swedenconnect.se/tmi-loa
          jwks: ${reference-sandbox.config-location}/oidc/tmi-loa.jwks
        - type: https://id.swedenconnect.se/loa/loa4
          issuer: https://fed.sandbox.swedenconnect.se/tmi-loa
          jwks: ${reference-sandbox.config-location}/oidc/tmi-loa.jwks
        - type: https://id.swedenconnect.se/contract/sc/eid-authorization-system
          issuer: https://fed.sandbox.swedenconnect.se/tmi-contracts
          jwks: ${reference-sandbox.config-location}/oidc/tmi-contracts.jwks
